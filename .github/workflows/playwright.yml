name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx bddgen
      - run: npx playwright test
      - run: npx newman run collections/jsonplaceholder.postman_collection.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-reports
          path: |
            playwright-report/
            allure-results/
          retention-days: 7
